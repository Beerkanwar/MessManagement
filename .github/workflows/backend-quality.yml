name: Backend quality gate

# Phase 13 backend gate: Django checks, migration cleanliness, the full test
# suite, the frozen OpenAPI contract, dependency vulnerabilities and static
# security findings. Every step must pass before a change can merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mess_test
          POSTGRES_USER: mess
          POSTGRES_PASSWORD: mess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mess -d mess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://mess:mess@127.0.0.1:5432/mess_test
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      QR_SECRET_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to find the latest phase contract baseline.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-quality.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-quality.txt

      - name: Django system check
        run: python manage.py check

      - name: No pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Test suite
        run: python -m pytest -q

      - name: OpenAPI schema drift
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          python scripts/export_schema.py
          git diff --exit-code -- ../docs/openapi/schema.yaml

      - name: OpenAPI breaking-change detector
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          BASE="$(git describe --tags --abbrev=0 --match 'phase-*' HEAD 2>/dev/null || true)"
          if [ -n "$BASE" ]; then
            echo "Comparing against contract tag $BASE"
            python scripts/check_schema_contract.py --base-ref "$BASE"
          else
            echo "No contract tag yet; drift check only."
            python scripts/check_schema_contract.py
          fi

      - name: Dependency vulnerability scan
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Static security scan
        run: python -m bandit -c pyproject.toml -r apps config -q
