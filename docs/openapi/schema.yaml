openapi: 3.0.3
info:
  title: Hostel Mess Management System API
  version: 1.0.0
  description: Central API contract for Hostel Mess Management System
paths:
  /api/v1/admin/app-versions:
    get:
      operationId: admin_app_versions_list
      description: Manage client application version policies (SUPPORTED, DEPRECATED,
        BLOCKED) [DEC-18].
      summary: List or Create Application Version Policies
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
    post:
      operationId: admin_app_versions_create
      description: Manage client application version policies (SUPPORTED, DEPRECATED,
        BLOCKED) [DEC-18].
      summary: List or Create Application Version Policies
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVersionPolicyCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
  /api/v1/admin/app-versions/{policy_id}:
    get:
      operationId: admin_app_versions_retrieve
      description: Retrieve, update or delete a specific application version policy
        by id.
      summary: Get, Update, or Delete Version Policy
      parameters:
      - in: path
        name: policy_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
        '204':
          description: Policy deleted
    put:
      operationId: admin_app_versions_update
      description: Retrieve, update or delete a specific application version policy
        by id.
      summary: Get, Update, or Delete Version Policy
      parameters:
      - in: path
        name: policy_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVersionPolicyUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
        '204':
          description: Policy deleted
    delete:
      operationId: admin_app_versions_destroy
      description: Retrieve, update or delete a specific application version policy
        by id.
      summary: Get, Update, or Delete Version Policy
      parameters:
      - in: path
        name: policy_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
        '204':
          description: Policy deleted
  /api/v1/admin/devices/{device_id}/revoke:
    post:
      operationId: admin_devices_revoke_create
      description: Super Admin revokes a device session. Enforces D14 sync waiting
        for managers [SPEC SDD §121].
      summary: Admin Revoke Device
      parameters:
      - in: path
        name: device_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRevokeDeviceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Device revoked or marked pending sync
        '400':
          description: Reason required
        '403':
          description: Permission denied
        '404':
          description: Device not found
  /api/v1/admin/hostel-clerks:
    get:
      operationId: admin_hostel_clerks_retrieve
      summary: List Hostel Clerks
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: List of clerks
    post:
      operationId: admin_hostel_clerks_create
      summary: Create Hostel Clerk
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClerkCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: Clerk created
  /api/v1/admin/hostel-clerks/{user_id}/deactivate:
    post:
      operationId: admin_hostel_clerks_deactivate_create
      description: Deactivates a Clerk's assignment.
      summary: Deactivate Hostel Clerk
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Clerk deactivated
  /api/v1/admin/hostel-clerks/{user_id}/reassign:
    post:
      operationId: admin_hostel_clerks_reassign_create
      description: Reassigns a Clerk to a different hostel.
      summary: Reassign Hostel Clerk
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClerkReassignRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Clerk reassigned
  /api/v1/admin/mess-managers:
    get:
      operationId: admin_mess_managers_list
      description: Super Admin management of Mess Manager accounts and assignments
        [DEC-21].
      summary: List or Create Mess Managers
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessManagerAssignment'
          description: ''
        '201':
          description: Mess Manager created
    post:
      operationId: admin_mess_managers_create
      description: Super Admin management of Mess Manager accounts and assignments
        [DEC-21].
      summary: List or Create Mess Managers
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessManagerCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessManagerAssignment'
          description: ''
        '201':
          description: Mess Manager created
  /api/v1/admin/mess-managers/{user_id}/deactivate:
    post:
      operationId: admin_mess_managers_deactivate_create
      description: Deactivates a Mess Manager's assignment.
      summary: Deactivate Mess Manager
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Mess Manager deactivated
  /api/v1/admin/mess-managers/{user_id}/reassign:
    post:
      operationId: admin_mess_managers_reassign_create
      description: Reassigns a Mess Manager to a different mess (Super Admin only)
        [DEC-21].
      summary: Reassign Mess Manager
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessManagerReassignRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Mess Manager reassigned
  /api/v1/admin/settings:
    get:
      operationId: admin_settings_retrieve
      description: Super Admin management of institutional configuration parameters
        [SPEC SDD §151, DEC-11].
      summary: Get or Update System Settings
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: List of settings or updated setting
        '201':
          description: Setting created/updated
    post:
      operationId: admin_settings_create
      description: Super Admin management of institutional configuration parameters
        [SPEC SDD §151, DEC-11].
      summary: Get or Update System Settings
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: List of settings or updated setting
        '201':
          description: Setting created/updated
  /api/v1/attendance:
    get:
      operationId: attendance_list
      description: Lists effective meal attendance records scoped to caller role [SPEC
        SDD §64, ImplementationGuide Phase 7]. A record is included unless its latest
        applied correction is REMOVE_INCORRECT.
      summary: List Effective Attendance
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
        description: Filter meals on or before YYYY-MM-DD
      - in: query
        name: hostel_id
        schema:
          type: integer
        description: Filter by hostel ID
      - in: query
        name: meal_type
        schema:
          type: string
        description: Filter by meal type code (BREAKFAST, LUNCH, DINNER)
      - in: query
        name: mess_id
        schema:
          type: integer
        description: Filter by mess ID
      - in: query
        name: start_date
        schema:
          type: string
        description: Filter meals on or after YYYY-MM-DD
      - in: query
        name: student_id
        schema:
          type: integer
        description: Filter by student ID
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealConsumption'
          description: ''
  /api/v1/attendance/corrections:
    get:
      operationId: attendance_corrections_list
      description: |-
        GET: Lists correction history scoped to caller role.
        POST: Submits an online attendance correction (ADD_MISSING or REMOVE_INCORRECT) [SPEC SRS §32, DEC-12, DEC-22]. Allowed for Super Admin, Hostel Clerk (own hostel), and Mess Manager (own mess). Reason required (min 5 chars).
      summary: List or Submit Attendance Corrections
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Filter by action (ADD_MISSING or REMOVE_INCORRECT)
      - in: query
        name: end_date
        schema:
          type: string
        description: Filter corrections on or before YYYY-MM-DD
      - in: query
        name: mess_id
        schema:
          type: integer
        description: Filter by mess ID
      - in: query
        name: start_date
        schema:
          type: string
        description: Filter corrections on or after YYYY-MM-DD
      - in: query
        name: student_id
        schema:
          type: integer
        description: Filter by student ID
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceCorrection'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCorrection'
          description: Correction applied
        '400':
          description: Validation error, missing reason, or locked billing period
        '404':
          description: Student or scope not found [D12]
    post:
      operationId: attendance_corrections_create
      description: |-
        GET: Lists correction history scoped to caller role.
        POST: Submits an online attendance correction (ADD_MISSING or REMOVE_INCORRECT) [SPEC SRS §32, DEC-12, DEC-22]. Allowed for Super Admin, Hostel Clerk (own hostel), and Mess Manager (own mess). Reason required (min 5 chars).
      summary: List or Submit Attendance Corrections
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Filter by action (ADD_MISSING or REMOVE_INCORRECT)
      - in: query
        name: end_date
        schema:
          type: string
        description: Filter corrections on or before YYYY-MM-DD
      - in: query
        name: mess_id
        schema:
          type: integer
        description: Filter by mess ID
      - in: query
        name: start_date
        schema:
          type: string
        description: Filter corrections on or after YYYY-MM-DD
      - in: query
        name: student_id
        schema:
          type: integer
        description: Filter by student ID
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCorrectionCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceCorrection'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCorrection'
          description: Correction applied
        '400':
          description: Validation error, missing reason, or locked billing period
        '404':
          description: Student or scope not found [D12]
  /api/v1/attendance/summary:
    get:
      operationId: attendance_summary_retrieve
      description: Returns aggregated counts of meals by type and total price snapshot
        for the caller scope.
      summary: Get Attendance Summary
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
        description: Summary end date YYYY-MM-DD
      - in: query
        name: hostel_id
        schema:
          type: integer
        description: Filter by hostel ID
      - in: query
        name: mess_id
        schema:
          type: integer
        description: Filter by mess ID
      - in: query
        name: start_date
        schema:
          type: string
        description: Summary start date YYYY-MM-DD
      - in: query
        name: student_id
        schema:
          type: integer
        description: Filter by student ID
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSummary'
          description: ''
  /api/v1/auth/change-password:
    post:
      operationId: auth_change_password_create
      description: Changes password for authenticated user [SPEC SDD §12].
      summary: Change Password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Incorrect current password or policy failure
        '401':
          description: Unauthenticated
  /api/v1/auth/forgot-password:
    post:
      operationId: auth_forgot_password_create
      description: Dispatches 6-digit verification OTP by email. Always returns 202
        [SPEC SRS §5, SDD §12].
      summary: Forgot Password / Request Reset OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: OTP dispatched if account exists
        '429':
          description: Hourly rate limit exceeded
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: Authenticates credentials, binds single active device, and returns
        token pair [SPEC SDD §11].
      summary: User Login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Successful authentication
        '401':
          description: Invalid credentials or inactive account
        '403':
          description: Wrong client surface for role
        '409':
          description: Previous manager device has unsynced transactions
        '429':
          description: Too many failed login attempts (locked 15 min)
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Revokes current device session and refresh tokens immediately [SPEC
        SDD §11].
      summary: User Logout
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthenticated
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      description: Returns current user identity, role, and assigned hostel/mess scopes
        [SPEC SDD §11].
      summary: Current User Profile & Scope [REC]
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: User profile and role summary
        '401':
          description: Unauthenticated
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: Rotates opaque refresh token with 30s replay grace window [SPEC
        SDD §11, DEC-10].
      summary: Rotate Refresh Token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: New token pair issued
        '401':
          description: Invalid, expired, or stolen refresh token
  /api/v1/auth/reset-password:
    post:
      operationId: auth_reset_password_create
      description: Sets new password with verified OTP, revoking all active sessions
        [SPEC SDD §12].
      summary: Reset Password with OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Invalid OTP or policy failure
  /api/v1/auth/verify-otp:
    post:
      operationId: auth_verify_otp_create
      description: Validates OTP code without consuming it [SPEC SDD §12, DEC-11].
      summary: Verify Password Reset OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: OTP verified successfully
        '400':
          description: Invalid OTP or attempts exceeded
  /api/v1/billing/balances:
    get:
      operationId: billing_balances_list
      description: Students read their own balance and ledger; the Super Admin reads
        every account. Negative balances are normal [DBDD-AC-25].
      summary: List Prepaid Balances
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Balance'
          description: ''
        '403':
          description: Permission denied
  /api/v1/billing/balances/{student_id}/credits:
    post:
      operationId: billing_balances_credits_create
      description: Super Admin posts a CREDIT entry with a mandatory reference and
        reason.
      summary: Add Authorized Credit
      parameters:
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
          description: ''
        '404':
          description: Account not found
  /api/v1/billing/bills:
    get:
      operationId: billing_bills_list
      description: Students see their own bills only once LOCKED; Clerks see their
        hostel's generated, reviewed and locked bills; Super Admin sees all [Phase
        10 build 9].
      summary: List Bills
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bill'
          description: ''
        '403':
          description: Permission denied
  /api/v1/billing/bills/{bill_id}:
    get:
      operationId: billing_bills_retrieve
      description: Returns one bill with its calculation lines and adjustments.
      summary: Bill Detail
      parameters:
      - in: path
        name: bill_id
        schema:
          type: integer
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
        '404':
          description: Not found
  /api/v1/billing/bills/{bill_id}/adjustments:
    post:
      operationId: billing_bills_adjustments_create
      description: Super Admin appends a positive FEE or FINE with a mandatory reason.
        Nothing can reduce a bill; locked periods are rejected [C01, SRS §20].
      summary: Append Bill Adjustment
      parameters:
      - in: path
        name: bill_id
        schema:
          type: integer
        required: true
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillAdjustmentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
        '400':
          description: Validation error
        '409':
          description: Billing period locked
  /api/v1/billing/opening-balances:
    get:
      operationId: billing_opening_balances_list
      description: Super Admin lists every student balance account.
      summary: List Opening Balances
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Balance'
          description: ''
    post:
      operationId: billing_opening_balances_create
      description: Super Admin creates one student's prepaid account with its single
        OPENING entry, using the college fee system's figure [SRS §18].
      summary: Set Opening Balance
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningBalanceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
          description: ''
        '409':
          description: Account already exists
  /api/v1/billing/opening-balances/import:
    post:
      operationId: billing_opening_balances_import_create
      description: 'Atomically imports a UTF-8 CSV with roll_number and amount columns,
        using the Phase 4 staging pattern: no row is written unless every row is valid.'
      summary: Import Opening Balances
      tags:
      - billing
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpeningBalanceImportRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningBalanceImportRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Import summary
        '400':
          description: Validation errors; nothing was imported
  /api/v1/billing/periods:
    get:
      operationId: billing_periods_list
      description: Lists billing periods and their lifecycle states [SPEC DBDD §8].
      summary: List Billing Periods
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillingPeriod'
          description: ''
  /api/v1/billing/periods/{billing_period_id}:
    get:
      operationId: billing_periods_retrieve
      description: Returns one period with summary totals, the count of transactions
        recorded since generation, and the generation pre-flight [Phase 10 build 5].
      summary: Billing Period Detail
      parameters:
      - in: path
        name: billing_period_id
        schema:
          type: integer
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPeriod'
          description: ''
        '404':
          description: Not found
    patch:
      operationId: billing_periods_partial_update
      description: Super Admin adjusts the dates of an OPEN period [SDD §151]; audited.
