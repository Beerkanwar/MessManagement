        description: Filter by client batch id
      - in: query
        name: transaction_id
        schema:
          type: string
        description: Filter by transaction id
      tags:
      - sync
      security:
      - jwtAuth: []
      responses:
        '200':
          description: List of sync transactions
  /api/v1/sync/upload:
    post:
      operationId: sync_upload_create
      description: Synchronizes offline transactions uploaded by Mess Managers [SPEC
        SDD §67, §68]. Processes batched meal and extra transactions with per-transaction
        idempotency, enforces 500-item limits, duplicate prevention, and returns delta
        updates.
      summary: Manager Batch Upload
      tags:
      - sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncUploadRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncUploadResponse'
          description: ''
        '400':
          description: Validation error or batch size exceeded
        '403':
          description: Unauthorized mess or blocked version
  /api/v1/upload:
    post:
      operationId: upload_create
      description: Synchronizes offline transactions uploaded by Mess Managers [SPEC
        SDD §67, §68]. Processes batched meal and extra transactions with per-transaction
        idempotency, enforces 500-item limits, duplicate prevention, and returns delta
        updates.
      summary: Manager Batch Upload
      tags:
      - sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncUploadRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncUploadResponse'
          description: ''
        '400':
          description: Validation error or batch size exceeded
        '403':
          description: Unauthorized mess or blocked version
  /health/live:
    get:
      operationId: health_live_retrieve
      description: Returns HTTP 200 when the backend web process is up and accepting
        HTTP traffic.
      summary: Process Liveness Probe
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      operationId: health_ready_retrieve
      description: Verifies that the database is reachable and that all database migrations
        have been applied. Returns HTTP 503 if the database is unreachable or migrations
        are pending.
      summary: Readiness Probe
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Database connected and migrations applied
        '503':
          description: Database unreachable or pending migrations
components:
  schemas:
    AdminRevokeDeviceRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 5
          description: Mandatory business reason for device revocation
      required:
      - reason
    ApplicationVersionPolicy:
      type: object
      properties:
        policy_id:
          type: integer
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/ApplicationVersionPolicyPlatformEnum'
          description: |-
            Target platform

            * `ANDROID` - Android
            * `IOS` - iOS
            * `WEB` - Web
        app_version:
          type: string
          description: Semantic version string (e.g. '1.0.0')
          maxLength: 50
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationVersionPolicyStatusEnum'
          description: |-
            Enforcement status

            * `SUPPORTED` - Supported
            * `DEPRECATED` - Deprecated
            * `BLOCKED` - Blocked
        force_update_message:
          type: string
          description: Message shown to users when update is required
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Optimistic concurrency control version counter
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when row was created (UTC)
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when row was last updated (UTC)
      required:
      - app_version
      - created_at
      - platform
      - policy_id
      - status
      - updated_at
    ApplicationVersionPolicyCreateRequest:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/Platform33cEnum'
        app_version:
          type: string
          minLength: 1
          maxLength: 50
        status:
          $ref: '#/components/schemas/Status7ffEnum'
        force_update_message:
          type: string
          default: ''
      required:
      - app_version
      - platform
      - status
    ApplicationVersionPolicyPlatformEnum:
      enum:
      - ANDROID
      - IOS
      - WEB
      type: string
      description: |-
        * `ANDROID` - Android
        * `IOS` - iOS
        * `WEB` - Web
    ApplicationVersionPolicyStatusEnum:
      enum:
      - SUPPORTED
      - DEPRECATED
      - BLOCKED
      type: string
      description: |-
        * `SUPPORTED` - Supported
        * `DEPRECATED` - Deprecated
        * `BLOCKED` - Blocked
    ApplicationVersionPolicyUpdateRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status7ffEnum'
        force_update_message:
          type: string
          default: ''
        version:
          type: integer
          description: Optimistic concurrency control version
      required:
      - status
      - version
    AttendanceCorrection:
