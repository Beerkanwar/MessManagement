openapi: 3.0.3
info:
  title: Hostel Mess Management System API
  version: 1.0.0
  description: Central API contract for Hostel Mess Management System
paths:
  /api/v1/admin/app-versions:
    get:
      operationId: admin_app_versions_list
      description: Manage client application version policies (SUPPORTED, DEPRECATED,
        BLOCKED) [DEC-18].
      summary: List or Create Application Version Policies
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
    post:
      operationId: admin_app_versions_create
      description: Manage client application version policies (SUPPORTED, DEPRECATED,
        BLOCKED) [DEC-18].
      summary: List or Create Application Version Policies
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVersionPolicyCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
  /api/v1/admin/app-versions/{policy_id}:
    get:
      operationId: admin_app_versions_retrieve
      description: Retrieve, update or delete a specific application version policy
        by id.
      summary: Get, Update, or Delete Version Policy
      parameters:
      - in: path
        name: policy_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
        '204':
          description: Policy deleted
    put:
      operationId: admin_app_versions_update
      description: Retrieve, update or delete a specific application version policy
        by id.
      summary: Get, Update, or Delete Version Policy
      parameters:
      - in: path
        name: policy_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVersionPolicyUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
        '204':
          description: Policy deleted
    delete:
      operationId: admin_app_versions_destroy
      description: Retrieve, update or delete a specific application version policy
        by id.
      summary: Get, Update, or Delete Version Policy
      parameters:
      - in: path
        name: policy_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVersionPolicy'
          description: ''
        '204':
          description: Policy deleted
  /api/v1/admin/devices/{device_id}/revoke:
    post:
      operationId: admin_devices_revoke_create
      description: Super Admin revokes a device session. Enforces D14 sync waiting
        for managers [SPEC SDD §121].
      summary: Admin Revoke Device
      parameters:
      - in: path
        name: device_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRevokeDeviceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Device revoked or marked pending sync
        '400':
          description: Reason required
        '403':
          description: Permission denied
        '404':
          description: Device not found
  /api/v1/admin/hostel-clerks:
    get:
      operationId: admin_hostel_clerks_retrieve
      summary: List Hostel Clerks
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: List of clerks
    post:
      operationId: admin_hostel_clerks_create
      summary: Create Hostel Clerk
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClerkCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: Clerk created
  /api/v1/admin/hostel-clerks/{user_id}/deactivate:
    post:
      operationId: admin_hostel_clerks_deactivate_create
      description: Deactivates a Clerk's assignment.
      summary: Deactivate Hostel Clerk
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Clerk deactivated
  /api/v1/admin/hostel-clerks/{user_id}/reassign:
    post:
      operationId: admin_hostel_clerks_reassign_create
      description: Reassigns a Clerk to a different hostel.
      summary: Reassign Hostel Clerk
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClerkReassignRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Clerk reassigned
  /api/v1/admin/mess-managers:
    get:
      operationId: admin_mess_managers_list
      description: Super Admin management of Mess Manager accounts and assignments
        [DEC-21].
      summary: List or Create Mess Managers
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessManagerAssignment'
          description: ''
        '201':
          description: Mess Manager created
    post:
      operationId: admin_mess_managers_create
      description: Super Admin management of Mess Manager accounts and assignments
        [DEC-21].
      summary: List or Create Mess Managers
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessManagerCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessManagerAssignment'
          description: ''
        '201':
          description: Mess Manager created
  /api/v1/admin/mess-managers/{user_id}/deactivate:
    post:
      operationId: admin_mess_managers_deactivate_create
      description: Deactivates a Mess Manager's assignment.
      summary: Deactivate Mess Manager
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Mess Manager deactivated
  /api/v1/admin/mess-managers/{user_id}/reassign:
    post:
      operationId: admin_mess_managers_reassign_create
      description: Reassigns a Mess Manager to a different mess (Super Admin only)
        [DEC-21].
      summary: Reassign Mess Manager
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessManagerReassignRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Mess Manager reassigned
  /api/v1/admin/settings:
    get:
      operationId: admin_settings_retrieve
      description: Super Admin management of institutional configuration parameters
        [SPEC SDD §151, DEC-11].
      summary: Get or Update System Settings
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: List of settings or updated setting
        '201':
          description: Setting created/updated
    post:
      operationId: admin_settings_create
      description: Super Admin management of institutional configuration parameters
        [SPEC SDD §151, DEC-11].
      summary: Get or Update System Settings
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: List of settings or updated setting
        '201':
          description: Setting created/updated
  /api/v1/attendance:
    get:
      operationId: attendance_retrieve
      description: Lists effective student meal attendance [SPEC SDD §64].
      summary: List Attendance Records
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          description: List of attendance records
  /api/v1/auth/change-password:
    post:
      operationId: auth_change_password_create
      description: Changes password for authenticated user [SPEC SDD §12].
      summary: Change Password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Incorrect current password or policy failure
        '401':
          description: Unauthenticated
  /api/v1/auth/forgot-password:
    post:
      operationId: auth_forgot_password_create
      description: Dispatches 6-digit verification OTP by email. Always returns 202
        [SPEC SRS §5, SDD §12].
      summary: Forgot Password / Request Reset OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: OTP dispatched if account exists
        '429':
          description: Hourly rate limit exceeded
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: Authenticates credentials, binds single active device, and returns
        token pair [SPEC SDD §11].
      summary: User Login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Successful authentication
        '401':
          description: Invalid credentials or inactive account
        '403':
          description: Wrong client surface for role
        '409':
          description: Previous manager device has unsynced transactions
        '429':
          description: Too many failed login attempts (locked 15 min)
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Revokes current device session and refresh tokens immediately [SPEC
        SDD §11].
      summary: User Logout
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthenticated
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      description: Returns current user identity, role, and assigned hostel/mess scopes
        [SPEC SDD §11].
      summary: Current User Profile & Scope [REC]
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: User profile and role summary
        '401':
          description: Unauthenticated
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: Rotates opaque refresh token with 30s replay grace window [SPEC
        SDD §11, DEC-10].
      summary: Rotate Refresh Token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: New token pair issued
        '401':
          description: Invalid, expired, or stolen refresh token
  /api/v1/auth/reset-password:
    post:
      operationId: auth_reset_password_create
      description: Sets new password with verified OTP, revoking all active sessions
        [SPEC SDD §12].
      summary: Reset Password with OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Invalid OTP or policy failure
  /api/v1/auth/verify-otp:
    post:
      operationId: auth_verify_otp_create
      description: Validates OTP code without consuming it [SPEC SDD §12, DEC-11].
      summary: Verify Password Reset OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: OTP verified successfully
        '400':
          description: Invalid OTP or attempts exceeded
  /api/v1/devices/current:
    get:
      operationId: devices_current_retrieve
      description: Returns current device session state and last sync time [SPEC SDD
        §11].
      summary: Current Device Binding
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Device details
        '401':
          description: Unauthenticated
  /api/v1/devices/register:
    post:
      operationId: devices_register_create
      description: Updates app version, device name, and platform for current device
        [SPEC SDD §11].
      summary: Update Device Metadata
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceMetadataRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Device metadata updated
        '401':
          description: Unauthenticated
  /api/v1/devices/revoke:
    post:
      operationId: devices_revoke_create
      description: Revokes authority of current device session immediately [SPEC SDD
        §11].
      summary: Self-Revoke Current Device
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Device revoked successfully
        '401':
          description: Unauthenticated
  /api/v1/events:
    get:
      operationId: events_retrieve
      description: Lists append-only system audit events [SPEC DBDD §12].
      summary: List Audit Events
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Audit events list
  /api/v1/extras/items:
    get:
      operationId: extras_items_list
      description: Clerk (own hostel) or Super Admin creates/manages extra items;
        Manager reads scoped items.
      summary: List or Create Extra Items
      tags:
      - extras
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtraItem'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtraItem'
          description: ''
    post:
      operationId: extras_items_create
      description: Clerk (own hostel) or Super Admin creates/manages extra items;
        Manager reads scoped items.
      summary: List or Create Extra Items
      tags:
      - extras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtraItemCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtraItem'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtraItem'
          description: ''
  /api/v1/extras/items/{item_id}:
    get:
      operationId: extras_items_retrieve
      description: Retrieve extra item details or update its display name with optimistic
        locking.
      summary: Get or Update Extra Item
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - extras
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtraItem'
          description: ''
    put:
      operationId: extras_items_update
      description: Retrieve extra item details or update its display name with optimistic
        locking.
      summary: Get or Update Extra Item
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - extras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtraItemUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtraItem'
          description: ''
  /api/v1/extras/items/{item_id}/deactivate:
    post:
      operationId: extras_items_deactivate_create
      description: Deactivate an extra item (Clerk own hostel or Super Admin).
      summary: Deactivate Extra Item
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - extras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtraItemDeactivateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtraItem'
          description: ''
  /api/v1/extras/items/{item_id}/prices:
    get:
      operationId: extras_items_prices_list
      description: List price versions or add a new effective-dated price version.
      summary: List or Create Extra Prices
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - extras
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtraPrice'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtraPrice'
          description: ''
    post:
      operationId: extras_items_prices_create
      description: List price versions or add a new effective-dated price version.
      summary: List or Create Extra Prices
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - extras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtraPriceCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtraPrice'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtraPrice'
          description: ''
  /api/v1/feedback:
    get:
      operationId: feedback_retrieve
      description: Lists submitted student mess feedback [SPEC DBDD §10].
      summary: List Feedback
      tags:
      - feedback
      security:
      - jwtAuth: []
      responses:
        '200':
          description: List of feedback records
  /api/v1/hostels:
    get:
      operationId: hostels_list
      description: Lists all hostels. Super Admin sees all; Clerks see their own hostel.
      summary: List Hostels
      tags:
      - hostels
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hostel'
          description: ''
    post:
      operationId: hostels_create
      description: Creates a new hostel. Super Admin only.
      summary: Create Hostel
      tags:
      - hostels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostelCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hostel'
          description: ''
  /api/v1/hostels/{hostel_id}:
    get:
      operationId: hostels_retrieve
      description: Returns a single hostel by ID.
      summary: Get Hostel Detail
      parameters:
      - in: path
        name: hostel_id
        schema:
          type: integer
        required: true
      tags:
      - hostels
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hostel'
          description: ''
    patch:
      operationId: hostels_partial_update
      description: Rename or update hostel. Version check enforced. Super Admin only.
      summary: Update Hostel
      parameters:
      - in: path
        name: hostel_id
        schema:
          type: integer
        required: true
      tags:
      - hostels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHostelUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hostel'
          description: ''
  /api/v1/hostels/{hostel_id}/deactivate:
    post:
      operationId: hostels_deactivate_create
      description: Deactivate a hostel. Refused if ACTIVE assignments or Clerk exist.
        Super Admin only.
      summary: Deactivate Hostel
      parameters:
      - in: path
        name: hostel_id
        schema:
          type: integer
        required: true
      tags:
      - hostels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostelDeactivateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hostel'
          description: ''
  /api/v1/meals/occurrences:
    get:
      operationId: meals_occurrences_list
      description: Lists scheduled meal occurrences scoped by role.
      summary: List Meal Occurrences
      tags:
      - meals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealOccurrence'
          description: ''
  /api/v1/meals/occurrences/{occurrence_id}/cancel:
    post:
      operationId: meals_occurrences_cancel_create
      description: Super Admin cancels a scheduled meal occurrence with reason [SPEC
        DBDD §5].
      summary: Cancel Meal Occurrence
      parameters:
      - in: path
        name: occurrence_id
        schema:
          type: integer
        required: true
      tags:
      - meals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealOccurrenceCancelRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealOccurrence'
          description: ''
  /api/v1/meals/types:
    get:
      operationId: meals_types_list
      description: Lists fixed meal types (Breakfast, Lunch, Evening Snacks, Dinner)
        [SPEC DBDD §1].
      summary: List Meal Types
      tags:
      - meals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealType'
          description: ''
  /api/v1/menus:
    get:
      operationId: menus_retrieve
      description: Lists published and draft menus [SPEC DBDD §9].
      summary: List Menus
      tags:
      - menus
      security:
      - jwtAuth: []
      responses:
        '200':
          description: List of menus
  /api/v1/messes:
    get:
      operationId: messes_list
      description: Lists messes (scoped) or creates a new mess hall (Super Admin only)
        [SPEC SDD §64].
      summary: List or Create Messes
      tags:
      - messes
      security:
