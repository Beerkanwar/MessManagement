          type: string
          readOnly: true
        semester_id:
          type: integer
          nullable: true
          readOnly: true
        semester_code:
          type: string
          readOnly: true
          nullable: true
        meal_component_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
          description: MAX(minimum_diet_count_snapshot, actual_meal_count) * common_diet_rate_snapshot
            [C01]
        extra_charges_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
          description: Sum of extra transactions in period
        adjustment_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
          description: Sum of FEE and FINE adjustments (non-negative additions only)
            [C01]
        final_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
          description: meal_component_amount + extra_charges_amount + adjustment_amount
            [C01]
        common_diet_rate_snapshot:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
          description: Rate snapshot at generation [DBDD §8.1]
