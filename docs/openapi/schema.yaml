components:
  schemas:
    AdminRevokeDeviceRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 5
          description: Mandatory business reason for device revocation
      required:
      - reason
    ApplicationVersionPolicy:
      type: object
      properties:
        policy_id:
          type: integer
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/ApplicationVersionPolicyPlatformEnum'
          description: |-
            Target platform

            * `ANDROID` - Android
            * `IOS` - iOS
            * `WEB` - Web
        app_version:
          type: string
          description: Semantic version string (e.g. '1.0.0')
          maxLength: 50
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationVersionPolicyStatusEnum'
          description: |-
            Enforcement status

            * `SUPPORTED` - Supported
            * `DEPRECATED` - Deprecated
            * `BLOCKED` - Blocked
        force_update_message:
          type: string
          description: Message shown to users when update is required
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Optimistic concurrency control version counter
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when row was created (UTC)
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when row was last updated (UTC)
      required:
      - app_version
      - created_at
      - platform
      - policy_id
      - status
      - updated_at
    ApplicationVersionPolicyCreateRequest:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/Platform33cEnum'
        app_version:
          type: string
          minLength: 1
          maxLength: 50
        status:
          $ref: '#/components/schemas/Status7ffEnum'
        force_update_message:
          type: string
          default: ''
      required:
      - app_version
      - platform
      - status
    ApplicationVersionPolicyPlatformEnum:
      enum:
      - ANDROID
      - IOS
      - WEB
      type: string
      description: |-
        * `ANDROID` - Android
        * `IOS` - iOS
        * `WEB` - Web
    ApplicationVersionPolicyStatusEnum:
      enum:
      - SUPPORTED
      - DEPRECATED
      - BLOCKED
      type: string
      description: |-
        * `SUPPORTED` - Supported
        * `DEPRECATED` - Deprecated
        * `BLOCKED` - Blocked
    ApplicationVersionPolicyUpdateRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status7ffEnum'
        force_update_message:
          type: string
          default: ''
        version:
          type: integer
          description: Optimistic concurrency control version
      required:
      - status
      - version
    BulkRejectRequest:
      type: object
      properties:
        assignment_ids:
          type: array
          items:
            type: integer
          description: List of assignment IDs to reject
          maxItems: 200
          minItems: 1
        notes:
          type: string
          default: ''
      required:
      - assignment_ids
    BulkVerifyRequest:
      type: object
      properties:
        assignment_ids:
          type: array
          items:
            type: integer
          description: List of assignment IDs to verify
          maxItems: 200
          minItems: 1
        notes:
          type: string
          default: ''
      required:
      - assignment_ids
    ChangePasswordRequestRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - current_password
      - new_password
    ClerkCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Clerk's institutional email
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone_number:
          type: string
          default: ''
          maxLength: 20
        hostel_code:
          type: string
          minLength: 1
          description: Hostel to assign the clerk to
          maxLength: 20
      required:
      - email
      - full_name
      - hostel_code
    ClerkReassignRequest:
      type: object
      properties:
        new_hostel_code:
          type: string
          minLength: 1
          description: New hostel code to assign
          maxLength: 20
      required:
      - new_hostel_code
    ExtraItem:
      type: object
      properties:
        extra_item_id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Item display name (e.g. 'Egg Curry')
          maxLength: 255
        normalized_name:
          type: string
          description: Trimmed and uppercase for uniqueness check [REC]
          maxLength: 255
        hostel_id:
          type: integer
          readOnly: true
        hostel_code:
          type: string
          readOnly: true
        hostel_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/Status372Enum'
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Optimistic concurrency control version counter
        current_price:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when row was created (UTC)
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when row was last updated (UTC)
      required:
      - created_at
      - current_price
      - extra_item_id
      - hostel_code
      - hostel_id
      - hostel_name
      - name
      - normalized_name
      - updated_at
    ExtraItemCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Item display name (e.g. 'Egg Curry')
          maxLength: 255
        hostel_code:
          type: string
          default: ''
          description: Hostel code (required for Super Admin, inferred for Clerk)
          maxLength: 20
        initial_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
          description: Optional starting unit price
        effective_from:
          type: string
          format: date
          description: Optional effective start date for initial price (default today)
      required:
      - name
    ExtraItemDeactivateRequest:
      type: object
      properties:
        version:
          type: integer
          description: Optimistic concurrency version counter
      required:
      - version
    ExtraItemUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        version:
          type: integer
          description: Optimistic concurrency version counter
      required:
      - name
      - version
    ExtraPrice:
      type: object
      properties:
        extra_price_id:
          type: integer
          readOnly: true
        extra_item_id:
          type: integer
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
        effective_from:
          type: string
          format: date
          description: Start date of price (inclusive)
        effective_to:
          type: string
          format: date
          nullable: true
          description: End date of price (inclusive, null=open-ended)
        created_by_id:
          type: integer
          description: Surrogate primary key matching DBDD §3 UserId
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when row was created (UTC)
      required:
      - created_at
