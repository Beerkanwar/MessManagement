      properties:
        batch_id:
          type: string
          format: uuid
        server_time:
          type: string
          format: date-time
        authorization_state:
          type: string
        offline_windows:
          type: object
          additionalProperties: {}
        student_changes:
          type: array
          items:
            type: object
            additionalProperties: {}
        student_removals:
          type: array
          items:
            type: object
            additionalProperties: {}
        configuration_changes:
          type: object
          additionalProperties: {}
        attendance_changes:
          type: object
          additionalProperties: {}
        resolved_results:
          type: array
          items:
            type: object
            additionalProperties: {}
        transaction_results:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResultItem'
        new_sync_cursor:
          type: integer
        cursor_issued_at:
          type: string
          format: date-time
        has_more:
          type: boolean
          default: false
        next_page_token:
          type: integer
          nullable: true
      required:
      - authorization_state
      - configuration_changes
      - new_sync_cursor
      - server_time
      - student_changes
      - transaction_results
    SystemSettingUpdateRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          description: Dot-notated setting key
          maxLength: 255
        value:
          type: string
          minLength: 1
          description: New string value for setting
        reason:
          type: string
          default: ''
          description: Audit explanation for change
          maxLength: 500
      required:
      - key
      - value
    TransactionResultItem:
      type: object
      description: Per-transaction processing outcome in sync response [SPEC DBDD
        §11.1].
      properties:
        transaction_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TransactionResultItemStatusEnum'
        result_code:
          type: string
          default: ''
        result_message:
          type: string
          default: ''
        entity_id:
          type: string
          default: ''
      required:
      - status
      - transaction_id
    TransactionResultItemStatusEnum:
      enum:
      - SYNCHRONIZED
      - IDEMPOTENT_SUCCESS
      - DUPLICATE
      - CONFLICT
      - REJECTED
      - RETRYABLE_ERROR
      type: string
      description: |-
        * `SYNCHRONIZED` - SYNCHRONIZED
        * `IDEMPOTENT_SUCCESS` - IDEMPOTENT_SUCCESS
        * `DUPLICATE` - DUPLICATE
        * `CONFLICT` - CONFLICT
        * `REJECTED` - REJECTED
        * `RETRYABLE_ERROR` - RETRYABLE_ERROR
    TransferStudentRequest:
      type: object
      properties:
        new_hostel_code:
          type: string
          minLength: 1
          description: Target hostel code
          maxLength: 20
        new_mess_code:
          type: string
          minLength: 1
          description: Target mess code
          maxLength: 20
        effective_from:
          type: string
          format: date
          description: Transfer effective date
        reason:
          type: string
          default: ''
          maxLength: 500
      required:
      - effective_from
      - new_hostel_code
      - new_mess_code
    UnlockPeriodRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      required:
      - reason
    UpdateDeviceMetadataRequest:
      type: object
      properties:
        app_version:
          type: string
          maxLength: 50
        device_name:
          type: string
          maxLength: 255
        platform:
          $ref: '#/components/schemas/Platform33cEnum'
    VerificationMethodEnum:
      enum:
      - QR_HMAC_SHA256
      - MANUAL_CORRECTION
      type: string
      description: |-
        * `QR_HMAC_SHA256` - QR HMAC-SHA256
        * `MANUAL_CORRECTION` - Manual Correction
    VerificationResultEnum:
      enum:
      - SUCCESS
      - NOT_APPLICABLE
      type: string
      description: |-
        * `SUCCESS` - Success
        * `NOT_APPLICABLE` - Not Applicable
    VerifyAssignmentRequest:
      type: object
      properties:
        notes:
          type: string
          default: ''
    VerifyOtpRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        otp:
          type: string
          minLength: 6
          description: 6-digit numerical OTP code
          maxLength: 6
      required:
      - email
      - otp
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
